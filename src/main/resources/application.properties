
spring.application.name=notification-service
server.port=8081

# Database (PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/notificationdb}
spring.datasource.username=${DB_USERNAME:notif}
spring.datasource.password=${DB_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true

# Gmail SMTP
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:not-set}
spring.mail.password=${MAIL_PASSWORD:not-set}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Twilio SMS
twilio.account-sid=${TWILIO_SID:dummy}
twilio.auth-token=${TWILIO_TOKEN:dummy}
twilio.from-number=${TWILIO_FROM:+10000000000}

# JWT
app.jwt.secret=${JWT_SECRET}
